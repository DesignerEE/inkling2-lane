name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relay tests (allow, DENY, SSE passthrough, fail-closed)
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test selftest
        run: python3 smoke_test.py --selftest
