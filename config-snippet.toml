# Append to ~/.kimi-code/config.toml (production lane, verified 2026-11-22).
# The client talks HTTP to the 5090 box; weights stay there.

[providers.inkling-lane]
type = "openai"
base_url = "http://<box-host>:8003/v1"
api_key = "local"

[models."inkling-lane/inkling-2-mini"]
provider = "inkling-lane"
model = "inkling-2-mini-abliterated"
max_context_size = 262144
capabilities = [ "tool_use" ]
display_name = "Inkling 2 Mini abliterated via ingine, DSpark thr 0.8 (5090 lane, 256K)"
